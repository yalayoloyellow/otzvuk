<!DOCTYPE html>
<meta charset="utf-8">
<title>пара</title>
<style>
  body{background:#07070a;color:#c8ffb0;font:400 14px/1.5 ui-monospace,Menlo,monospace;
       padding:24px;text-shadow:0 0 6px rgba(160,255,120,.25)}
  pre{white-space:pre;font:inherit}
  b{color:#d8ff4a;font-weight:400}
  .d{color:#3a5a34}
</style>
<pre id="э">нажми любую клавишу</pre>
<script type="module">
// ЧИСТЫЙ СТЕНД. Только два генератора: первый идёт током в конденсатор
// второго. Ничего больше — ни резонатора, ни фильтров, ни каскада, ни
// площадок. Если тот самый эффект здесь есть, значит в приборе он тонет
// в остальном тракте. Если нет — механизм не тот, и ищем дальше.
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let ctx=null,node=null,идёт=false;
const p={первый:.35, деление:.5, увод:.12, сила:.3, кривая:.15, ход:.3};
const РУЧКИ=[
  {к:'первый',  м:['KeyQ','KeyW'], имя:'ПЕРВЫЙ  (высота источника)'},
  {к:'деление', м:['KeyE','KeyR'], имя:'ДЕЛЕНИЕ (÷1 ÷2 ÷3 ÷4 ÷5)'},
  {к:'увод',    м:['KeyT','KeyY'], имя:'УВОД    (захват → заедание)'},
  {к:'сила',    м:['KeyU','KeyI'], имя:'СИЛА    (крепость захвата)'},
  {к:'кривая',  м:['KeyO','KeyP'], имя:'КРИВАЯ  (сама ползёт)'},
  {к:'ход',     м:['KeyA','KeyS'], имя:'ХОД     (быстро/медленно)'}
];
let отч={f1:0,f2:0,осц:new Float32Array(200)};
const код=`
const SR=sampleRate;
class Пара extends AudioWorkletProcessor{
  constructor(){
    super();
    this.v1=.3;this.q1=1;this.v2=.5;this.q2=0;
    this.p={первый:.35,деление:.5,увод:.12,сила:.3,кривая:.15,ход:.3};
    // МЕДЛЕННАЯ КРИВАЯ. Аттрактор Рёсслера: траектория долго вьётся по
    // спирали, потом резко выбрасывается и начинает заново — и никогда не
    // повторяется в точности. Она ведёт частоты обоих генераторов, поэтому
    // звук едет сам, проходя по пути через сближения (низы), перегрузы и
    // области захвата. Это и есть «звук ходит по кривой».
    this.rx=1;this.ry=1;this.rz=1;
    this.n1=0;this.n2=0;this.окно=0;this.f1=0;this.f2=0;
    this.ц1=0;this.ц2=0;this.прошРасх=0;this.проск=0;
    this.осц=new Float32Array(200);this.и=0;this.отч=0;
    this.port.onmessage=e=>{const d=e.data;
      if(d.t==='p') for(const k in d.v) this.p[k]=d.v[k];};
  }
  process(_,outs){
    const oL=outs[0][0],oR=outs[0][1],n=oL.length,p=this.p;
    // Кривая осталась, но теперь она лишь ПОДТАЛКИВАЕТ увод, а не водит
    // частоты напрямую: прежде звук ехал слишком плавно и походил на флэнджер.
    const шк=(.4+p.ход*7)*40/SR;
    const dx=-this.ry-this.rz, dy=this.rx+.2*this.ry, dz=.2+this.rz*(this.rx-5.7);
    this.rx+=dx*шк; this.ry+=dy*шк; this.rz+=dz*шк;
    if(!(this.rx===this.rx)||Math.abs(this.rx)>60){this.rx=1;this.ry=1;this.rz=1;}

    const f1=40*Math.pow(2,p.первый*7);
    // Деление выбирается ступенями, как на приборе: ÷1 ÷2 ÷3 ÷4 ÷5.
    const дел=[1,2,3,4,5][Math.min(4,Math.floor(p.деление*4.99))];
    const точная=f1/дел;
    // УВОД от точного деления. Захват держит широкую полосу, а срывается
    // резко — вся зона от ритма до дребезга узкая, поэтому шкала растянута
    // возле нуля: у левого края разрешение в доли герца, у правого десятки.
    const кривоУвод=(this.rx/12)*p.кривая;
    const у=Math.max(0,Math.min(1,p.увод+кривоУвод));
    const увод=Math.pow(у,2.6)*точная*.7;
    const f2=Math.max(8,точная+увод);
    const силаТек=p.сила;
    const ln4=Math.log(4);
    for(let s=0;s<n;s++){
      // первый: свободный генератор
      const RC1=1/(ln4*f1);
      this.v1+=((this.q1?1:0)-this.v1)*(1-Math.exp(-1/(SR*RC1)));
      if(this.q1? this.v1>.68 : this.v1<.32){this.q1^=1; if(this.q1){this.n1++;this.ц1++;}}
      const вых1=this.q1?1:-1;
      // второй: тот же генератор, но в конденсатор ТЕЧЁТ ТОК от первого
      const RC2=1/(ln4*f2);
      this.v2+=((this.q2?1:0)-this.v2)*(1-Math.exp(-1/(SR*RC2)));
      this.v2+=вых1*силаТек/(SR*RC2);
      if(this.v2<-.6)this.v2=-.6; else if(this.v2>1.6)this.v2=1.6;
      if(this.q2? this.v2>.68 : this.v2<.32){this.q2^=1; if(this.q2){this.n2++;this.ц2++;}}
      const вых2=this.q2?1:-1;
      // оба на общей нагрузке, асимметричный предел — как один транзистор
      const см=(вых1*.5+вых2*.7)*1.4;
      let y=см>.8?.8+(см-.8)*.05:см<-1?-1+(см+1)*.12:см;
      y*=.5;
      oL[s]=y;oR[s]=y;
      this.осц[this.и=(this.и+1)%200]=y;
    }
    this.окно+=n;
    if(this.окно>=SR*.5){
      this.f1=this.n1*2;this.f2=this.n2*2;this.n1=0;this.n2=0;this.окно=0;
      // проскок фазы: насколько разошлись циклы за полсекунды. Меряем прямо
      // расхождение, а не отношение счётчиков в окне — прежний способ выдавал
      // одну и ту же цифру при любой расстройке, это была частота его окна.
      const dел=[1,2,3,4,5][Math.min(4,Math.floor(this.p.деление*4.99))];
      const расх=this.ц1-dел*this.ц2;
      this.проск=Math.abs(расх-this.прошРасх)*2;
      this.прошРасх=расх;
      if(Math.abs(расх)>1e7){this.ц1=0;this.ц2=0;this.прошРасх=0;}
    }
    this.отч+=n;
    if(this.отч>=SR/30){this.отч=0;
      this.port.postMessage({f1:this.f1,f2:this.f2,осц:this.осц.slice(),
        проск:this.проск});}
    return true;
  }
}
registerProcessor('пара',Пара);`;
async function пуск(){
  if(идёт)return;
  ctx=new AudioContext();
  const url=URL.createObjectURL(new Blob([код],{type:'application/javascript'}));
  await ctx.audioWorklet.addModule(url);URL.revokeObjectURL(url);
  node=new AudioWorkletNode(ctx,'пара',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
  node.connect(ctx.destination);
  node.port.onmessage=e=>{отч=e.data;};
  await ctx.resume();идёт=true;шли();
}
function шли(){node&&node.port.postMessage({t:'p',v:p});}
const держ=new Map();
setInterval(()=>{
  if(!держ.size)return;
  const t=performance.now();
  for(const[k,с]of держ){
    const д=(t-с.нач)/1000; if(д<.25)continue;
    p[с.ключ]=clamp(p[с.ключ]+с.знак*(.1+Math.min(д,2)*.5)/60,0,1);
  }
  шли();
},1000/60);
addEventListener('pointerdown',()=>пуск());
addEventListener('keydown',async e=>{
  if(!идёт)await пуск();
  for(const r of РУЧКИ){
    const з=e.code===r.м[0]?-1:e.code===r.м[1]?1:0;
    if(!з)continue; e.preventDefault();
    if(!держ.has(e.code)){держ.set(e.code,{ключ:r.к,знак:з,нач:performance.now()});
      p[r.к]=clamp(p[r.к]+з*.015,0,1);шли();}
    return;
  }
});
addEventListener('keyup',e=>держ.delete(e.code));
addEventListener('blur',()=>держ.clear());
function пол(v,ш){const n=clamp(Math.round(v*ш),0,ш);return '▮'.repeat(n)+'·'.repeat(ш-n);}
function кадр(){
  if(идёт){
    const о=отч.осц||new Float32Array(200);
    const В=11,Ш=90,х=[];
    for(let y=0;y<В;y++)х.push(new Array(Ш).fill(' '));
    for(let i=0;i<Ш;i++){
      const v=clamp(о[Math.floor(i*о.length/Ш)]*2,-1,1);
      const y=clamp(Math.round((1-(v*.5+.5))*(В-1)),0,В-1);
      х[y][i]='▮';
    }
    const отн=отч.f2>0?отч.f1/отч.f2:0;
    const дел=[1,2,3,4,5,6,8].find(k=>Math.abs(отн-k)<.08);
    const пр=отч.проск||0;
    const режим = пр<.5?'<b>ЗАХВАТ</b> — стоит ровно'
      : пр<2?'<b>раскачка</b>'
      : пр<8?'<b>РИТМ</b>'
      : пр<30?'<b>заедание</b>'
      : '<b>дребезг</b>';
    $('#э').innerHTML=
      х.map(r=>r.join('')).join('\n')+'\n\n'+
      `  первый <b>${отч.f1}</b> Гц    второй <b>${отч.f2}</b> Гц    `+
      `<span class="d">заедание ${(отч.проск||0).toFixed(1)} /с</span>   `+
      режим+'\n\n'+
      РУЧКИ.map(r=>`  ${r.имя.padEnd(22)} ${пол(p[r.к],14)}  <span class="d">${r.м.map(c=>c.replace('Key','').toLowerCase()).join('')}</span>`).join('\n')+
      '\n\n  <span class="d">держи клавишу — едет; только два генератора, больше ничего</span>';
  }
  requestAnimationFrame(кадр);
}
кадр();
</script>
