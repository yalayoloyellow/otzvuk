<!DOCTYPE html>
<meta charset="utf-8">
<title>отзвук · инструмент</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --bg:#07070a; --fg:#c8ffb0; --dim:#3a5a34; --dim2:#22331f;
         --hot:#d8ff4a; --warn:#ff7a3d; --line:#16210f }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);
    font:400 13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.02em;padding:14px;-webkit-font-smoothing:antialiased;
    text-shadow:0 0 6px rgba(160,255,120,.22)}
  pre{white-space:pre;font:inherit}
  #экран{max-width:104ch;margin:0 auto}
  #рисунок{white-space:pre}
  .тускло{color:var(--dim)}
  .совсем{color:var(--dim2)}
  .ярко{color:var(--hot)}
  .тревога{color:var(--warn)}
  #рисунок{color:var(--fg);line-height:.92;font-size:11px;letter-spacing:0;
    text-shadow:0 0 8px rgba(150,255,110,.35),0 0 18px rgba(120,255,90,.14)}
  #строка{color:var(--dim);margin-top:6px;font-size:11px}
  b{font-weight:400;color:var(--hot)}
</style>
<div id="экран">
<pre id="шапка"></pre>
<pre id="рисунок"></pre>
<pre id="приборы"></pre>
<pre id="ручки"></pre>
<pre id="строка"></pre>
</div>
<script type="module" src="инструмент.js"></script>
