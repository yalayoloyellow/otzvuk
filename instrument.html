<!DOCTYPE html>
<meta charset="utf-8">
<title>отзвук · инструмент</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --bg:#07070a; --fg:#c8ffb0; --dim:#3a5a34; --dim2:#22331f;
         --hot:#d8ff4a; --warn:#ff7a3d; --line:#16210f }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);
    font:400 13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.02em;padding:14px;-webkit-font-smoothing:antialiased;
    text-shadow:0 0 6px rgba(160,255,120,.22)}
  pre{white-space:pre;font:inherit}
  /* Экран тянется по окну, а не по фиксированной сетке: раньше легенда
     уезжала вправо на всём, что уже 104 символов. */
  #screen{width:100%;margin:0 auto}
  #canvas{white-space:pre}
  .dim{color:var(--dim)}
  .dim2{color:var(--dim2)}
  .hot{color:var(--hot)}
  .warn{color:var(--warn)}
  #canvas{color:var(--fg);line-height:.92;font-size:11px;letter-spacing:0;
    text-shadow:0 0 8px rgba(150,255,110,.35),0 0 18px rgba(120,255,90,.14)}
  #line{color:var(--dim);margin-top:6px;font-size:11px;white-space:pre-wrap}
  #devices,#knobs{white-space:pre-wrap}
  b{font-weight:400;color:var(--hot)}
  #tabs{margin:2px 0 4px}
  .tab{cursor:pointer;padding:0 2px}
  .tab:hover{color:var(--hot)}
</style>
<div id="screen">
<pre id="head"></pre>
<pre id="canvas"></pre>
<pre id="tabs"></pre>
<pre id="devices"></pre>
<pre id="knobs"></pre>
<pre id="line"></pre>
</div>
<script type="module" src="instrument.js"></script>
