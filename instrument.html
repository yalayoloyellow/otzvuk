<!DOCTYPE html>
<meta charset="utf-8">
<title>отзвук · инструмент</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Один цвет, три яркости. Жёлтый и оранжевый выбивались из фосфора и
     ломали общий вид. */
  /* ОДНА ЛЕСТНИЦА НА ПАНЕЛЬ И КАРТИНУ. Пять ступеней на каждый из трёх
     цветов, и обе половины экрана берут оттенки отсюда. Прежде панель жила
     на прозрачности, а картина на своей лестнице — две разные системы, и
     панель неизбежно выходила светлее картины, хотя главное здесь картина.

     Ступени выровнены по глазу (0.299R+0.587G+0.114B): глаз к зелёному
     втрое чувствительнее, чем к красному, и вшестеро — чем к синему.
     Опорная ступень 3 — тот самый цвет, что был у панели.

         ступень   картина              панель
           4       сердцевина, ореол    ручка под пальцем
           3       тело                 значения и шкалы
           2       окраина              имена ручек
           1       дальняя окраина      клавиши и подсказки
           0       не рисуется          — */
  :root{ --bg:#06080a; --line:#13210f;
         --z0:#2c5827; --z1:#4a8b3f; --z2:#74c266; --z3:#a8f090; --z4:#d8ffc0;
         --k0:#7c3527; --k1:#ad4b36; --k2:#d66348; --k3:#ff7a5c; --k4:#ffc2b0;
         --s0:#26527a; --s1:#35729f; --s2:#4f96d4; --s3:#6fb3ff; --s4:#c2e2ff;
         --fg:var(--z3); --hot:var(--z4); --warn:var(--z4);
         /* Красный — и только он — означает ПОСТ: то, чего в приборе нет.
            На панели им подписаны его ручки, на картине — ровно те места,
            где пост изменил звук. Другого красного в интерфейсе нет. */
         --post:var(--k3); --posthot:var(--k4);
         /* Синий — и только он — означает ГОЛОС: входное гнездо и всё, что в
            него воткнуто. На панели им подписаны его ручки, на картине —
            места, где голос слышен сам по себе. */
         --golos:var(--s3); --goloshot:var(--s4) }
  *{box-sizing:border-box;margin:0;padding:0}

  /* СЕТКА. В текстовом интерфейсе всё меряется знакоместом — другого модуля
     тут нет. Один кегль на всё, одна строка как модуль, и всякое расстояние
     кратно ей. Тогда ничего не «почти совпадает».

         кегль        11px
         строка       16px   ← модуль
         знакоместо    6.6px  (0.6 em у моноширинного)

     Отступ по вертикали два модуля, по горизонтали три — ровно в полтора
     раза, как и должен стоять текст на листе. */
  body{background:var(--bg);color:var(--fg);
    font:400 11px/16px ui-monospace,SFMono-Regular,Menlo,monospace;
    /* Разрядки нет: она растянула бы знакоместо, и картина с текстом
       перестали бы стоять в одной сетке. */
    /* Боковая рамка — ЦЕЛОЕ ЧИСЛО ЗНАКОМЕСТ, а не круглое число пикселей:
       48px это 7.25 знакоместа, и левый край панели не стоял на сетке.
       Единица ch у моноширинного шрифта и есть ширина знакоместа. */
    letter-spacing:0;padding:32px 8ch;-webkit-font-smoothing:antialiased;
    text-shadow:0 0 6px rgba(160,255,120,.22);
    /* У картины пропорция постоянная, значит заполнить окно целиком она
       не может и остаток неизбежен. Пусть он ложится сверху и снизу
       поровну — тогда это поле, а не пустота под композицией. `safe`
       снимает центрирование, когда содержимое не влезает: иначе верх
       уехал бы за край и стал недоступен. */
    /* ЛЕГЕНДА ЖИВЁТ ВНИЗУ ЭКРАНА, а не под композицией. Она была последней
       строкой блока, а блок стоял по центру — и легенда висела где-то в
       середине. Место у неё одно: низ, с той же рамкой, что и всё
       остальное. Первая строка сетки забирает остаток и центрирует в себе
       композицию, вторая держит легенду. */
    min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);
    grid-template-rows:1fr auto;row-gap:16px}
  #screen{align-self:safe center}
  pre{white-space:pre;font:inherit}
  /* ДВЕ КОМПОНОВКИ, и это не подгонка под экран, а два вида прибора.

     СТОЯ (окно выше, чем шире) — картина сверху, панель под ней, легенда
     внизу. Прибор на столе: экран на уровне глаз, органы под руками.

     ЛЁЖА (окно шире, чем выше) — панель слева одной колонкой, картина
     справа во всю оставшуюся ширину и высоту, легенда внизу через оба
     столбца. Так стоит любой прибор с дисплеем сбоку от ручек.

     Промежуток между блоками модуль, а между столбцами два: по горизонтали
     расстояния всегда шире, иначе столбцы читаются как один. */
  /* Зазор между столбцами — тоже целое число знакомест. Было 32px = 4.8
     знакоместа, и картина стояла между сеткой. */
  #screen{width:100%;display:grid;gap:16px 6ch;
    grid-template-columns:1fr;
    grid-template-areas:"ris" "panel"}
  /* Лёжа встаём не при любом перевесе ширины, а при заметном. У картины
     своя постоянная пропорция — вдвое шире, чем выше, — и в почти
     квадратном окне она стоя выходит КРУПНЕЕ: там ей достаётся вся ширина,
     а не то, что осталось от панели. */
  @media (min-aspect-ratio:5/4){
    #screen{grid-template-columns:52ch 1fr;
            grid-template-areas:"panel ris"}
  }
  /* Картина стоит в своей клетке по центру: пропорция у неё постоянная, и
     если клетка шире или выше — остаётся поле, а не растяжка. */
  /* Картина ПРИЖАТА К СЕТКЕ, а не центрирована. Центрирование сдвигало её
     на произвольные пять пикселей, и знакоместа картины переставали
     совпадать со знакоместами панели. Остаток ширины уходит полем вправо. */
  #ris{grid-area:ris;min-width:0;overflow:hidden;
       display:flex;align-items:flex-start;justify-content:flex-start}
  #panel{grid-area:panel}
  #canvas{white-space:pre}
  /* Заголовка нет. До запуска здесь стоит приглашение, после — пусто, и
     пустая строка не должна занимать модуль. */
  #head:empty{display:none}
  #head{margin-bottom:16px}
  /* ПАНЕЛЬ ОПУЩЕНА НА СТУПЕНЬ. Самое яркое на экране — сердцевина картины;
     панель до неё не дотягивается никогда, кроме ручки под пальцем. Прежде
     было наоборот: панель светила ровным полным цветом, картина рядом
     казалась тусклой. */
  .dim2{color:var(--z1)}   /* клавиши, подсказки, справочное */
  .dim{color:var(--z2)}    /* имена ручек */
  .fg{color:var(--z3)}     /* значения и шкалы */
  .hot{color:var(--z4)}    /* ручка под пальцем */
  .postdim{color:var(--k2)}
  .post{color:var(--post)}
  .posthot{color:var(--posthot);text-shadow:0 0 6px rgba(255,122,92,.4)}
  .golosdim{color:var(--s2)}
  .golos{color:var(--golos)}
  .goloshot{color:var(--goloshot);text-shadow:0 0 6px rgba(111,179,255,.4)}
  .warn{color:var(--warn)}
  /* У картины СВОЙ межстрочный — плотный. Иначе знакоместо вытягивается по
     вертикали и фигура выходит узкой. Это второй ритм, и он намеренный:
     картина и текст остаются двумя блоками через один модуль. */
  /* Строка картины — РОВНО ПОЛОВИНА МОДУЛЯ. Было 10px, то есть 1.6 модуля:
     низ картины висел между строками панели и ни во что не укладывался.
     Две строки картины = одна строка текста, и число строк держим чётным. */
  #canvas{position:relative;line-height:8px}

  /* КАРТИНА СЛОЯМИ, И ЭТО НЕ УКРАШЕНИЕ, А УСТРОЙСТВО.

     Цвет знакоместа в тексте требует обернуть его в отдельный элемент, и
     элемент заводится на каждую СМЕНУ цвета вдоль строки. Раскрашенная
     подробно картина упиралась в это намертво: девятьсот элементов на кадр,
     тридцать раз в секунду, и подробность приходилось приносить в жертву.

     Здесь картина разложена на слои: свой слой на каждый цвет и каждую
     ступень свечения. В слое лежит ЧИСТЫЙ ТЕКСТ — где знакоместо не его,
     там пробел. Ни одного элемента, ни одного разбора разметки: чистый
     текст ставится в узел напрямую. Подробность стала бесплатной.

     Ступени — это свечение, а не белизна. Громкое и плотное горит ярче и
     даёт ореол, тихое и второстепенное уходит в темноту своего же цвета. */
  /* ВСЕ слои сняты с потока, а размер коробке задаётся числом: держать его
     первым слоем нельзя — стоит ему опустеть (а он пустеет всегда, когда
     звук целиком ушёл в другой цвет), коробка схлопывается в точку, и
     остальные слои вываливаются из неё вбок и вниз. */
  #canvas .sl{position:absolute;top:0;left:0;margin:0;
    white-space:pre;font:inherit;line-height:inherit}

  /* ПАЛИТРА КАРТИНЫ. Пять ступеней на цвет, и ПАНЕЛЬНЫЙ ЦВЕТ СТОИТ
     ЧЕТВЁРТЫМ: под ним две тёмные, над ним одна раскалённая.

     Так решаются обе крайности, в которые я по очереди свалился. Сначала
     нижней ступенью был обесцвеченный тёмный оттенок — он занимал большую
     часть фигуры и читался грязью. Потом нижней ступенью стал сам базовый
     цвет — и пропал объём: всё горело одинаково, свечению не от чего было
     оторваться.

     Тьма нужна, но НАСЫЩЕННАЯ. Тёмный, но чистый по тону, читается как
     «дальше», а не как грязь; на его фоне верхняя ступень и даёт свечение.
     Белого по-прежнему нет: подъём идёт ореолом, а не обесцвечиванием.

     Сколько знакомест попадает в каждую ступень, решает не абсолютная
     яркость, а ранг — доля от всех горящих. Поэтому тональный состав у
     картины один и тот же при любом звуке: меняются фигуры, а не
     настроение. */

  /* РАВНОВЕСИЕ ПО ГЛАЗУ, А НЕ ПО ЧИСЛАМ. Глаз к зелёному примерно втрое
     чувствительнее, чем к красному, и вшестеро — чем к синему. Одинаковые
     по величине оттенки читаются разной яркостью: красный выходил тусклым и
     будто полупрозрачным, синий — почти чёрным.

     Поэтому нижние ступени у красного и синего подняты, а ореол у них
     сильнее зелёного на той же ступени. Опорные ступени — панельный цвет и
     его горячий вариант — оставлены как есть: по ним картина и панель
     сходятся. Считано по 0.299R + 0.587G + 0.114B: нижние ступени всех трёх
     цветов теперь стоят в пределах десятой доли друг от друга.

     Опорой служат ИМЕННО ПАНЕЛЬНЫЕ красный и синий: лестница ведёт к ним, а
     не мимо. Поднять их самих нельзя — тогда картина разойдётся с панелью, —
     поэтому наверху красный и синий всё равно темнее зелёного, и разницу
     добирает ореол, а не цвет. */

  /* СХЕМА — зелёный. Сам прибор. */
  #canvas .c0.t0{color:#2c5827}
  #canvas .c0.t1{color:#4a8b3f}
  #canvas .c0.t2{color:#74c266;text-shadow:0 0 4px rgba(120,230,90,.26)}
  #canvas .c0.t3{color:var(--fg);text-shadow:0 0 5px rgba(150,255,110,.5)}
  #canvas .c0.t4{color:var(--hot);
    text-shadow:0 0 6px rgba(175,255,135,.95),0 0 15px rgba(110,255,70,.55),
                0 0 32px rgba(70,235,45,.3)}

  /* ПОСТ — красный. Там, где обработка изменила форму волны. */
  #canvas .c1.t0{color:#7c3527}
  #canvas .c1.t1{color:#ad4b36}
  #canvas .c1.t2{color:#d66348;text-shadow:0 0 4px rgba(245,120,85,.42)}
  #canvas .c1.t3{color:var(--post);
    text-shadow:0 0 5px rgba(255,122,92,.7),0 0 12px rgba(255,90,60,.3)}
  #canvas .c1.t4{color:var(--posthot);
    text-shadow:0 0 6px rgba(255,160,130,1),0 0 15px rgba(255,95,65,.7),
                0 0 32px rgba(235,70,45,.38)}

  /* ГОЛОС — синий. И его влияние на схему, и он сам. */
  #canvas .c2.t0{color:#26527a}
  #canvas .c2.t1{color:#35729f}
  #canvas .c2.t2{color:#4f96d4;text-shadow:0 0 4px rgba(105,185,255,.5)}
  #canvas .c2.t3{color:var(--golos);
    text-shadow:0 0 5px rgba(111,179,255,.8),0 0 12px rgba(80,150,255,.36)}
  #canvas .c2.t4{color:var(--goloshot);
    text-shadow:0 0 6px rgba(165,220,255,1),0 0 15px rgba(85,165,255,.8),
                0 0 32px rgba(60,135,235,.45)}

  #line{color:var(--fg);white-space:pre-wrap}
  #devices,#knobs{white-space:pre-wrap}
  b{font-weight:400;color:var(--hot)}
  #tabs{margin:2px 0 4px}
  /* Вкладка должна выглядеть нажимаемой: рамка, курсор, отклик на наведение. */
  .tab{cursor:pointer;padding:1px 6px;border:1px solid var(--line);border-radius:3px}
  .tab:hover{color:var(--hot);border-color:var(--fg)}
</style>
<pre id="head"></pre>
<div id="screen">
<div id="ris"><div id="canvas"></div></div>
<div id="panel"><pre id="knobs"></pre></div>
</div>
<pre id="line"></pre>
<script type="module" src="instrument.js"></script>
