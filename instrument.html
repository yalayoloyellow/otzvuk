<!DOCTYPE html>
<meta charset="utf-8">
<title>отзвук · инструмент</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Один цвет, три яркости. Жёлтый и оранжевый выбивались из фосфора и
     ломали общий вид. */
  /* Тусклых ЦВЕТОВ здесь больше нет: тише — это тот же зелёный вполсилы,
     а не другой, грязный. Осталась только рамка вкладки. */
  :root{ --bg:#06080a; --fg:#a8f090;
         --hot:#d8ffc0; --warn:#d8ffc0; --line:#13210f;
         /* Красный — и только он — означает ПОСТ: то, чего в приборе нет.
            На панели им подписаны его ручки, на картине — ровно те места,
            где пост изменил звук. Другого красного в интерфейсе нет. */
         --post:#ff7a5c; --posthot:#ffc2b0;
         /* Синий — и только он — означает ГОЛОС: входное гнездо и всё, что в
            него воткнуто. На панели им подписаны его ручки, на картине —
            места, где голос слышен сам по себе. */
         --golos:#6fb3ff; --goloshot:#c2e2ff }
  *{box-sizing:border-box;margin:0;padding:0}

  /* СЕТКА. В текстовом интерфейсе всё меряется знакоместом — другого модуля
     тут нет. Один кегль на всё, одна строка как модуль, и всякое расстояние
     кратно ей. Тогда ничего не «почти совпадает».

         кегль        11px
         строка       16px   ← модуль
         знакоместо    6.6px  (0.6 em у моноширинного)

     Отступ по вертикали два модуля, по горизонтали три — ровно в полтора
     раза, как и должен стоять текст на листе. */
  body{background:var(--bg);color:var(--fg);
    font:400 11px/16px ui-monospace,SFMono-Regular,Menlo,monospace;
    /* Разрядки нет: она растянула бы знакоместо, и картина с текстом
       перестали бы стоять в одной сетке. */
    letter-spacing:0;padding:32px 48px;-webkit-font-smoothing:antialiased;
    text-shadow:0 0 6px rgba(160,255,120,.22);
    /* У картины пропорция постоянная, значит заполнить окно целиком она
       не может и остаток неизбежен. Пусть он ложится сверху и снизу
       поровну — тогда это поле, а не пустота под композицией. `safe`
       снимает центрирование, когда содержимое не влезает: иначе верх
       уехал бы за край и стал недоступен. */
    min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);
    align-content:safe center}
  pre{white-space:pre;font:inherit}
  /* ДВЕ КОМПОНОВКИ, и это не подгонка под экран, а два вида прибора.

     СТОЯ (окно выше, чем шире) — картина сверху, панель под ней, легенда
     внизу. Прибор на столе: экран на уровне глаз, органы под руками.

     ЛЁЖА (окно шире, чем выше) — панель слева одной колонкой, картина
     справа во всю оставшуюся ширину и высоту, легенда внизу через оба
     столбца. Так стоит любой прибор с дисплеем сбоку от ручек.

     Промежуток между блоками модуль, а между столбцами два: по горизонтали
     расстояния всегда шире, иначе столбцы читаются как один. */
  #screen{width:100%;display:grid;gap:16px 32px;
    grid-template-columns:1fr;
    grid-template-areas:"ris" "panel" "line"}
  /* Лёжа встаём не при любом перевесе ширины, а при заметном. У картины
     своя постоянная пропорция — вдвое шире, чем выше, — и в почти
     квадратном окне она стоя выходит КРУПНЕЕ: там ей достаётся вся ширина,
     а не то, что осталось от панели. */
  @media (min-aspect-ratio:5/4){
    #screen{grid-template-columns:auto 1fr;
            grid-template-areas:"panel ris" "line line"}
  }
  /* Картина стоит в своей клетке по центру: пропорция у неё постоянная, и
     если клетка шире или выше — остаётся поле, а не растяжка. */
  #ris{grid-area:ris;min-width:0;overflow:hidden;
       display:flex;align-items:center;justify-content:center}
  #panel{grid-area:panel}
  #line{grid-area:line}
  #canvas{white-space:pre}
  /* Заголовка нет. До запуска здесь стоит приглашение, после — пусто, и
     пустая строка не должна занимать модуль. */
  #head:empty{display:none}
  #head{margin-bottom:16px}
  /* ТУСКЛОЕ — ПРОЗРАЧНОСТЬЮ, а не тёмным цветом. Тёмно-зелёный читался
     грязью на чёрном; тот же зелёный вполсилы читается тишиной. */
  .dim{color:var(--fg);opacity:.55}
  .fg{color:var(--fg)}
  .dim2{color:var(--fg);opacity:.34}
  .hot{color:var(--hot)}
  .post{color:var(--post)}
  .posthot{color:var(--posthot);text-shadow:0 0 6px rgba(255,122,92,.4)}
  .golos{color:var(--golos)}
  .goloshot{color:var(--goloshot);text-shadow:0 0 6px rgba(111,179,255,.4)}
  .warn{color:var(--warn)}
  /* У картины СВОЙ межстрочный — плотный. Иначе знакоместо вытягивается по
     вертикали и фигура выходит узкой. Это второй ритм, и он намеренный:
     картина и текст остаются двумя блоками через один модуль. */
  #canvas{position:relative;line-height:10px}

  /* КАРТИНА СЛОЯМИ, И ЭТО НЕ УКРАШЕНИЕ, А УСТРОЙСТВО.

     Цвет знакоместа в тексте требует обернуть его в отдельный элемент, и
     элемент заводится на каждую СМЕНУ цвета вдоль строки. Раскрашенная
     подробно картина упиралась в это намертво: девятьсот элементов на кадр,
     тридцать раз в секунду, и подробность приходилось приносить в жертву.

     Здесь картина разложена на слои: свой слой на каждый цвет и каждую
     ступень свечения. В слое лежит ЧИСТЫЙ ТЕКСТ — где знакоместо не его,
     там пробел. Ни одного элемента, ни одного разбора разметки: чистый
     текст ставится в узел напрямую. Подробность стала бесплатной.

     Ступени — это свечение, а не белизна. Громкое и плотное горит ярче и
     даёт ореол, тихое и второстепенное уходит в темноту своего же цвета. */
  #canvas .sl{position:absolute;top:0;left:0;margin:0;
    white-space:pre;font:inherit;line-height:inherit}
  #canvas .sl:first-child{position:relative}

  /* СХЕМА — зелёный. Сам прибор. */
  #canvas .c0.t0{color:#37623a}
  #canvas .c0.t1{color:#79c96e;text-shadow:0 0 5px rgba(120,255,90,.34)}
  #canvas .c0.t2{color:#a6ff82;
    text-shadow:0 0 6px rgba(150,255,110,.85),0 0 16px rgba(100,255,60,.45),
                0 0 34px rgba(60,230,40,.22)}
  /* ПОСТ — красный. Там, где обработка изменила форму волны. */
  #canvas .c1.t0{color:#6f3025}
  #canvas .c1.t1{color:#d9614a;text-shadow:0 0 5px rgba(255,110,80,.34)}
  #canvas .c1.t2{color:#ff8763;
    text-shadow:0 0 6px rgba(255,130,95,.85),0 0 16px rgba(255,80,50,.45),
                0 0 34px rgba(230,60,35,.22)}
  /* ГОЛОС — синий. И его влияние на схему, и он сам. */
  #canvas .c2.t0{color:#274a70}
  #canvas .c2.t1{color:#589ada;text-shadow:0 0 5px rgba(95,175,255,.34)}
  #canvas .c2.t2{color:#8ac6ff;
    text-shadow:0 0 6px rgba(120,195,255,.85),0 0 16px rgba(70,150,255,.45),
                0 0 34px rgba(50,120,230,.22)}
  #line{color:var(--fg);white-space:pre-wrap}
  #devices,#knobs{white-space:pre-wrap}
  b{font-weight:400;color:var(--hot)}
  #tabs{margin:2px 0 4px}
  /* Вкладка должна выглядеть нажимаемой: рамка, курсор, отклик на наведение. */
  .tab{cursor:pointer;padding:1px 6px;border:1px solid var(--line);border-radius:3px}
  .tab:hover{color:var(--hot);border-color:var(--fg)}
</style>
<pre id="head"></pre>
<div id="screen">
<div id="ris"><div id="canvas"></div></div>
<div id="panel"><pre id="knobs"></pre></div>
<pre id="line"></pre>
</div>
<script type="module" src="instrument.js"></script>
