<!DOCTYPE html>
<meta charset="utf-8">
<title>отзвук · инструмент</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- СВОЁ ОКНО ВМЕСТО ВКЛАДКИ. Прибор ставится приложением: у окна нет ни
     вкладок, ни адресной строки, а значит нечего закрывать посреди звука и
     некому перехватывать Tab. Запуск: python3 serve.py --okno -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="znachok-192.png">
<style>
  /* Один цвет, три яркости. Жёлтый и оранжевый выбивались из фосфора и
     ломали общий вид. */
  /* ОДНА ЛЕСТНИЦА НА ПАНЕЛЬ И КАРТИНУ. Пять ступеней на каждый из трёх
     цветов, и обе половины экрана берут оттенки отсюда. Прежде панель жила
     на прозрачности, а картина на своей лестнице — две разные системы, и
     панель неизбежно выходила светлее картины, хотя главное здесь картина.

     Ступени выровнены по глазу (0.299R+0.587G+0.114B): глаз к зелёному
     втрое чувствительнее, чем к красному, и вшестеро — чем к синему.
     Опорная ступень 3 — тот самый цвет, что был у панели.

     СТУПЕНИ ПОЛУЧЕНЫ УМНОЖЕНИЕМ ОПОРНОЙ НА ДОЛЮ, и это не приём, а физика:
     у люминофора спектр не меняется от яркости, меняется только сила
     свечения. Умножение сохраняет тон и долю насыщенности В ТОЧНОСТИ.

     Подбирать тёмные ступени на глаз нельзя — я пробовал дважды и оба раза
     промахнулся мимо тона. Замер прежней лестницы: у зелёного тон уезжал со
     105° у опорной до 114° на тёмном конце, то есть в сторону холодного, а
     насыщенность падала вдвое. Оттого тёмно-зелёный и читался «каким-то не
     тем»: это был не тот же цвет потише, а другой цвет.

         ступень   картина              панель
           4       сердцевина, ореол    ручка под пальцем
           3       тело                 значения и шкалы
           2       окраина              имена ручек
           1       дальняя окраина      клавиши и подсказки
           0       не рисуется          — */
  :root{ --bg:#06080a; --line:#13210f;
         --z0:#385030; --z1:#5a804d; --z2:#82b96f; --z3:#a8f090; --z4:#d8ffc0;
         --k0:#76382a; --k1:#a44f3b; --k2:#d1644c; --k3:#ff7a5c; --k4:#ffc2b0;
         --s0:#304e6f; --s1:#436c9a; --s2:#5a91cf; --s3:#6fb3ff; --s4:#c2e2ff;
         /* РОЗОВАЯ ЗОНА — модуляция. Четвёртый цвет панели, и подобран он по
            той же мере, что прочие — но с первого раза я померил только
            ТРЕТЬЮ ступень, а шкала почти вся состоит из нижних. Оттого зона
            и вышла тусклой: у розового нижние были 57·87·122 против 73·102·136
            у синего. Теперь вся лестница сведена по яркости для глаза:

              зелёный   69 · 111 · 161 · 207 · 237
              красный   73 · 102 · 131 · 159 · 210
              синий     73 · 102 · 136 · 167 · 220
              розовый   76 · 104 · 131 · 157 · 215

            Тон при этом остался прежним — сведена только громкость. */
         --p0:#78306a; --p1:#a3438c; --p2:#cc55b0; --p3:#f56ac2; --p4:#ffc0e8;
         --y0:#4f4a12; --y1:#6f6714; --y2:#948916; --y3:#b8ac28; --y4:#fff29b;
         /* Синий — и только он — означает ГОЛОС: входное гнездо и всё, что в
            него воткнуто. На панели им подписаны его ручки, на картине —
            места, где голос слышен сам по себе. */ }
  *{box-sizing:border-box;margin:0;padding:0}

  /* СЕТКА. В текстовом интерфейсе всё меряется знакоместом — другого модуля
     тут нет. Один кегль на всё, одна строка как модуль, и всякое расстояние
     кратно ей. Тогда ничего не «почти совпадает».

         кегль        11px
         строка       16px   ← модуль
         знакоместо    6.6px  (0.6 em у моноширинного)

     Отступ по вертикали два модуля, по горизонтали три — ровно в полтора
     раза, как и должен стоять текст на листе. */
  body{background:var(--bg);color:var(--z3);
    /* ОДИН КЕГЛЬ И ОДНА СТРОКА НА ВСЁ. Пока у панели был кегль 11 со строкой
       16, а у картины 11 со строкой 8, знакоместа были разной высоты и сетки
       две. Теперь и там и там 8 на 8: одна клетка, одна сетка, и панель
       может рисоваться тем же полем, что фигура. */
    font:400 8px/8px ui-monospace,SFMono-Regular,Menlo,monospace;
    /* Разрядки нет: она растянула бы знакоместо, и картина с текстом
       перестали бы стоять в одной сетке. */
    /* Боковая рамка — ЦЕЛОЕ ЧИСЛО ЗНАКОМЕСТ, а не круглое число пикселей:
       48px это 7.25 знакоместа, и левый край панели не стоял на сетке.
       Единица ch у моноширинного шрифта и есть ширина знакоместа. */
    letter-spacing:0;padding:32px 10ch;-webkit-font-smoothing:antialiased;
    /* ОРЕОЛА ЗДЕСЬ БОЛЬШЕ НЕТ. Он стоял на body и наследовался ВСЕМ, что не
       переопределило своё, — то есть вокруг каждой красной и синей буквы на
       экране светился зелёный. Это не оттенок, а подмешивание зелёного света
       в красный: тон уезжает к жёлтому, насыщенность падает. Хуже всего
       мелким знакам картины, где ореол по площади больше самого знака.
       Замер до правки: панель .postdim, панель .golos, картина крас t0,
       картина син t0 — у всех ореол rgba(160,255,120,.22).
       Теперь ореол несёт каждый сам, и всегда своего тона. */
    /* У картины пропорция постоянная, значит заполнить окно целиком она
       не может и остаток неизбежен. Пусть он ложится сверху и снизу
       поровну — тогда это поле, а не пустота под композицией. `safe`
       снимает центрирование, когда содержимое не влезает: иначе верх
       уехал бы за край и стал недоступен. */
    /* ЛЕГЕНДА ЖИВЁТ ВНИЗУ ЭКРАНА, а не под композицией. Она была последней
       строкой блока, а блок стоял по центру — и легенда висела где-то в
       середине. Место у неё одно: низ, с той же рамкой, что и всё
       остальное. Первая строка сетки забирает остаток и центрирует в себе
       композицию, вторая держит легенду. */
    min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);
    grid-template-rows:1fr auto;row-gap:16px;
    /* Картина, вытесненная за правый край, обрезается по окну. `clip`, а не
       `hidden`: заводить прокрутку незачем — увезённое смотреть не надо. */
    overflow-x:clip}
  #screen{align-self:safe center}
  pre{white-space:pre;font:inherit}
  /* Так стоит любой прибор с дисплеем сбоку от ручек: органы слева под
     рукой, экран справа под глазом, легенда внизу через оба столбца.
     Зазор между столбцами — целое число знакомест: было 32px = 4.8
     знакоместа, и картина стояла между сеткой. */
  /* ВИД ОДИН: панель слева, картина справа от неё.

     Пара стоит по центру, пока помещается. Когда тесно — картина уходит за
     правый край, а панель остаётся на месте: `safe` снимает центрирование
     при нехватке места и ставит содержимое от начала, иначе обрезало бы
     панель слева. Когда картины не остаётся вовсе, панель центрируется одна
     и по горизонтали, и по вертикали.

     Второго режима нет нарочно. Перекладка панели по колонкам и была
     источником рывков: её высота прыгала вдвое-втрое, высота картины
     считается из остатка после панели, а перемер шёл вторым проходом на
     следующем кадре — и это было видно как двухшаговый рывок. */
  /* Ширина во всю рамку — иначе центрировать не в чем: клетка сжалась бы по
     содержимому, и «по центру» совпало бы с «слева». */
  /* `min-width:0` обязателен. Без него у элемента сетки минимальный размер
     считается по содержимому, и экран раздувался ШИРЕ отведённой колонки —
     а раз он шире, то и место под картину мерилось по раздутому: картина
     выходила на треть больше, чем есть куда её ставить, и лезла за край. */
  #screen{width:100%;min-width:0;display:grid;gap:16px 8ch;
    grid-auto-flow:column;grid-auto-columns:max-content;
    justify-content:safe center}
  /* Рамка сжимается только тогда, когда иначе не влезла бы САМА ПАНЕЛЬ:
     пятьдесят два знакоместа плюс две рамки по десять — это триста
     пятьдесят точек. Порог стоял на шестистах, и поля пропадали задолго до
     того, как в них появлялась нужда. */
  @media (max-width:360px){ body{padding:32px 2ch} }
  /* Картина ПРИЖАТА К НАЧАЛУ своей клетки, а не центрирована: центрирование
     сдвигало её на произвольные полпикселя, и знакоместа картины переставали
     совпадать со знакоместами панели. */
  #ris{display:flex;align-items:flex-start;justify-content:flex-start}
  /* ПАНЕЛЬ — ДВА СЛОЯ НА ОДНОЙ СЕТКЕ. Снизу поле света: шкалы рисуются тем
     же движком, теми же знаками и теми же классами, что фигура. Сверху
     текст: имена, клавиши, показания. Клетка у обоих одна, поэтому
     совмещаются они точно, без подгонки. */
  #panel{position:relative}
  #ppole{position:absolute;top:0;left:0;pointer-events:none}
  #ppole pre{position:absolute;top:0;left:0;margin:0;white-space:pre;font:inherit}
  #knobs{position:relative}
  #canvas{white-space:pre}
  /* Заголовка нет. До запуска здесь стоит приглашение, после — пусто, и
     пустая строка не должна занимать модуль. */
  #head:empty{display:none}
  #head{margin-bottom:16px}
  /* ОДНА ТАБЛИЦА СТУПЕНЕЙ НА ПАНЕЛЬ И КАРТИНУ.

     Пятнадцать правил — три цвета по пять ступеней, — и обе половины экрана
     берут вид отсюда. Цвет и ореол задаются ВМЕСТЕ: ореол всегда своего
     тона, потому что чужой тон подмешивает в цвет чужой свет.

     Прежде это были две системы: у картины лестница с ореолами, у панели
     плоские классы плюс общий зелёный ореол от body. Один и тот же цвет
     выглядел в двух половинах по-разному, и никакой подбор оттенков этого
     не лечил.

         ступень   картина              панель
           4       сердцевина           ручка под пальцем
           3       тело                 значения и горящая шкала
           2       окраина              имена ручек
           1       дальняя окраина      клавиши, подсказки
           0       дальний край         справочное, погасшая шкала   */

  .z0{color:var(--z0)}
  .z1{color:var(--z1);text-shadow:0 0 3px rgba(150,255,110,.22)}
  .z2{color:var(--z2);text-shadow:0 0 4px rgba(150,255,110,.38)}
  .z3{color:var(--z3);text-shadow:0 0 5px rgba(150,255,110,.55),
                                  0 0 11px rgba(110,255,70,.22)}
  .z4{color:var(--z4);text-shadow:0 0 6px rgba(175,255,135,.9),
                                  0 0 14px rgba(110,255,70,.55),
                                  0 0 30px rgba(70,235,45,.26)}

  /* ОРЕОЛ ВСЕГДА НАСЫЩЕННЕЕ СВОЕГО ЦВЕТА. Свечение складывается: там, где
     знаков много, к цвету добавляется его же ореол. Если ореол бледнее
     текста, плотное пятно УПЛЫВАЕТ В БЕЛЁСОЕ — красный уходил в розовый.
     Если насыщеннее — плотное место, наоборот, густеет, как у зелёного.

         насыщенность   текст   ореол было   стало
         зелёный         0.40      0.57       0.57
         красный         0.64      0.57 ✗     0.76
         синий           0.56      0.43 ✗     0.67

     У красного и синего ореол вдобавок сильнее зелёного на той же ступени:
     глаз к ним менее чувствителен, и цветность теряется быстрее. */
  .k3{color:var(--k3);text-shadow:0 0 5px rgba(255,100,60,.7),
                                  0 0 12px rgba(240,74,40,.3)}
  .k4{color:var(--k4);text-shadow:0 0 6px rgba(255,120,80,1),
                                  0 0 15px rgba(255,80,45,.7),
                                  0 0 32px rgba(230,60,32,.34)}

  .s3{color:var(--s3);text-shadow:0 0 5px rgba(80,160,255,.78),
                                  0 0 12px rgba(48,124,238,.34)}
  .s4{color:var(--s4);text-shadow:0 0 6px rgba(110,185,255,1),
                                  0 0 15px rgba(70,150,255,.8),
                                  0 0 32px rgba(45,115,225,.4)}

  /* ТОТ ЖЕ ЦВЕТ, НО СВОЙ ОРЕОЛ НА КАЖДОЙ СТУПЕНИ. В картине акцент всегда
     стоит на панельном цвете — темнить его нельзя, — но светиться он обязан
     по-разному: иначе самая тусклая красная точка сияет как самая яркая, и
     в плотных местах это складывается вчетверо против зелёного. Пятно тогда
     белеет не от цвета, а от накопленного свечения. */
  /* ПОЛНАЯ ЛЕСТНИЦА АКЦЕНТА — для панели, где зона красная и синяя целиком,
     вплоть до погасшей дорожки. Ступени подобраны по яркости для глаза так,
     чтобы совпасть с зелёными: 73 102 130 против 69 111 160. Ореол, как
     везде, насыщеннее своего цвета. */
  .p3{color:var(--p3);text-shadow:0 0 5px rgba(245,106,194,.72),
                                  0 0 12px rgba(220,70,170,.32)}
  .p4{color:var(--p4);text-shadow:0 0 6px rgba(255,140,215,1),
                                  0 0 15px rgba(240,90,190,.75),
                                  0 0 32px rgba(210,60,160,.36)}
  .p0{color:var(--p0)}
  .y3{color:var(--y3);text-shadow:0 0 5px rgba(184,172,40,.72),
      0 0 12px rgba(184,172,40,.30)}
  .y4{color:var(--y4);text-shadow:0 0 6px rgba(255,242,155,1),
      0 0 14px rgba(230,214,80,.55)}
  .y0{color:var(--y0)}
  .y1{color:var(--y1);text-shadow:0 0 3px rgba(150,138,25,.26)}
  .y2{color:var(--y2);text-shadow:0 0 4px rgba(170,155,25,.44)}
  .p1{color:var(--p1);text-shadow:0 0 3px rgba(245,110,195,.26)}
  .p2{color:var(--p2);text-shadow:0 0 4px rgba(245,105,190,.44)}
  .pg0{color:var(--p3)}
  .pg1{color:var(--p3);text-shadow:0 0 3px rgba(245,110,195,.24)}
  .pg2{color:var(--p3);text-shadow:0 0 4px rgba(245,105,190,.40)}

  .k0{color:var(--k0)}
  .k1{color:var(--k1);text-shadow:0 0 3px rgba(255,110,72,.24)}
  .k2{color:var(--k2);text-shadow:0 0 4px rgba(255,105,66,.40)}
  .s0{color:var(--s0)}
  .s1{color:var(--s1);text-shadow:0 0 3px rgba(85,165,255,.26)}
  .s2{color:var(--s2);text-shadow:0 0 4px rgba(82,162,255,.42)}
  .kg0{color:var(--k3)}
  .kg1{color:var(--k3);text-shadow:0 0 3px rgba(255,110,72,.3)}
  .kg2{color:var(--k3);text-shadow:0 0 4px rgba(255,105,66,.5)}
  .sg0{color:var(--s3)}
  .sg1{color:var(--s3);text-shadow:0 0 3px rgba(85,165,255,.34)}
  .sg2{color:var(--s3);text-shadow:0 0 4px rgba(82,162,255,.55)}

  /* У картины СВОЙ межстрочный — плотный. Иначе знакоместо вытягивается по
     вертикали и фигура выходит узкой. Это второй ритм, и он намеренный:
     картина и текст остаются двумя блоками через один модуль. */
  #canvas{position:relative}

  /* КАРТИНА СЛОЯМИ, И ЭТО НЕ УКРАШЕНИЕ, А УСТРОЙСТВО.

     Цвет знакоместа в тексте требует обернуть его в отдельный элемент, и
     элемент заводится на каждую СМЕНУ цвета вдоль строки. Раскрашенная
     подробно картина упиралась в это намертво: девятьсот элементов на кадр,
     тридцать раз в секунду, и подробность приходилось приносить в жертву.

     Здесь картина разложена на слои: свой слой на каждый цвет и каждую
     ступень свечения. В слое лежит ЧИСТЫЙ ТЕКСТ — где знакоместо не его,
     там пробел. Ни одного элемента, ни одного разбора разметки: чистый
     текст ставится в узел напрямую. Подробность стала бесплатной.

     Ступени — это свечение, а не белизна. Громкое и плотное горит ярче и
     даёт ореол, тихое и второстепенное уходит в темноту своего же цвета. */
  /* ВСЕ слои сняты с потока, а размер коробке задаётся числом: держать его
     первым слоем нельзя — стоит ему опустеть (а он пустеет всегда, когда
     звук целиком ушёл в другой цвет), коробка схлопывается в точку, и
     остальные слои вываливаются из неё вбок и вниз. */
  #canvas .sl{position:absolute;top:0;left:0;margin:0;
    white-space:pre;font:inherit}

  /* У АКЦЕНТОВ КАРТИНЫ ЛЕСТНИЦЫ ЦВЕТА НЕТ — ТОЛЬКО ЧЕРНИЛА.

     Зелёного много: он держит глубину пятью ступенями, и от этого фигура
     объёмная. К красному и синему то же правило неприменимо, и это не вкус,
     а зрение: цветовое разрешение глаза втрое-вчетверо ниже яркостного, и
     мелкий цветной знак усредняется почти в чёрное. Замер среднего цвета
     клетки для #ff7a5c: точка · даёт rgb(15,7,6), полоса ▮ даёт
     rgb(111,53,40). Затемни точку ещё — и останется бурое пятно.

     Поэтому акцент в картине всегда стоит на панельном цвете, а тише или
     громче он — видно ТОЛЬКО по знаку: точка против плотной звезды, разница
     по чернилам почти в девять раз. Тон не уходит ни на ступень, и красное в
     картине это ровно то же красное, что на ручке COMP.

     Какая ступень какому цвету достаётся — решает таблица в instrument.js:
     зелёный берёт все пять, акценты только верхние две. */

  #line{color:var(--z3);white-space:pre-wrap}
  #devices,#knobs{white-space:pre-wrap}
